name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      BEER_DATA:
        description: "Beers json (optional, falls back to API)"
        required: false
        type: string
      notify:
        description: 'Send Telegram notification'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BEER_DATA: ${{ inputs.BEER_DATA }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          # 'true' links the Beer Store page (garden nav tab, sitemap); unset until release
          STORE_PUBLIC: ${{ vars.STORE_PUBLIC }}
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify group
        if: ${{ inputs.notify != false }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_GROUP_CHAT_ID" ]] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_GROUP_CHAT_ID}\",\"text\":\"<b>🍺 Menu site deployed</b>\n${{ steps.deployment.outputs.page_url }}\",\"parse_mode\":\"HTML\",\"disable_web_page_preview\":true}"
