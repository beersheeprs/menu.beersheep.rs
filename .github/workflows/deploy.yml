name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      BEER_DATA:
        description: "Beers json (optional, falls back to API)"
        required: false
        type: string
      notify:
        description: 'Send Telegram notification'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Queue scraper-triggered runs so deploys never overlap or land out of order
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # One job for build + deploy: a second job would wait for another runner
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # WebP label thumbnails from earlier runs: only new labels are downloaded
      # (caches are immutable, so each run saves a new key and restores the latest)
      - name: Restore label thumbnails
        uses: actions/cache/restore@v6
        with:
          path: .cache/thumbnails
          key: thumbnails-${{ github.run_id }}
          restore-keys: thumbnails-

      - name: Build
        run: npm run build
        env:
          BEER_DATA: ${{ inputs.BEER_DATA }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          # 'true' links the Beer Store page (garden nav tab, sitemap); unset until release
          STORE_PUBLIC: ${{ vars.STORE_PUBLIC }}
          NODE_ENV: production

      # Saved right after Build, so a failed deploy or notification keeps the new thumbnails
      - name: Save label thumbnails
        uses: actions/cache/save@v6
        with:
          path: .cache/thumbnails
          key: thumbnails-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # The site is live by now: a Telegram failure must not fail the run
      - name: Notify group
        if: ${{ inputs.notify != false }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_GROUP_CHAT_ID" ]] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_GROUP_CHAT_ID}\",\"text\":\"<b>🍺 Menu site deployed</b>\n${{ steps.deployment.outputs.page_url }}\",\"parse_mode\":\"HTML\",\"disable_web_page_preview\":true}"
